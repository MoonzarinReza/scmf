[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scmf"
version = "0.1.3"
description = "Supernova Classification with FPCA and Machine Learning"
authors = [{name = "Moonzarin Reza"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "astropy",
    "catboost",
    "scikit-learn",
]



[tool.setuptools.package-data]
scmf = ["data/*.csv", "data/*.txt", "sample_lightcurves/*.csv", "examples/*.ipynb"]

[tool.setuptools.packages.find]
include = ["scmf*"]